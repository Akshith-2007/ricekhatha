name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Find the project folder
        run: |
          DIR=$(dirname "$(find . -name gradlew -not -path '*/node_modules/*' | head -n 1)")
          if [ -z "$DIR" ] || [ "$DIR" = "." ] && [ ! -f ./gradlew ]; then
            echo "::error::gradlew not found. Upload all files from the RiceBrokerKhata folder to the repository."
            ls -la
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/RiceKhata.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RiceKhata-apk
          path: out/RiceKhata.apk
